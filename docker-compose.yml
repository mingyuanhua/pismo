services:
  localstack:
    image: localstack/localstack:4.7
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 2s
      timeout: 2s
      retries: 20

  init:
    # One-shot setup keeps resource creation reproducible and lets the worker
    # start only after LocalStack is ready.
    build: .
    command: python scripts/init_localstack.py
    environment: &aws-environment
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      QUEUE_NAME: events
      DLQ_NAME: events-dlq
      TABLE_NAME: events
    depends_on:
      localstack:
        condition: service_healthy

  processor:
    build: .
    environment:
      <<: *aws-environment
      QUEUE_URL: http://localstack:4566/000000000000/events
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
